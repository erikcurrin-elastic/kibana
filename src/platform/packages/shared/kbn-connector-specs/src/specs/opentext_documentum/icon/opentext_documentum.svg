  <line x1="11" y1="16" x2="21" y2="16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="19" x2="17" y2="19" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
